services:
  - type: web
    name: beam-surgical-digital-twin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /health
    disk:
      name: beam-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BEAM_ALLOWED_ORIGINS
        sync: false
